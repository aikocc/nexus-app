<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking confirmed — Nexus Diagnostics</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0E14;--paper:#F7F8FA;--signal:#00D9A3;--signal-dim:#0A3B30;--gray:#7C8699;--line:#1C2230}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:#E8EDF4;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.card{background:#0F141F;border:1px solid var(--line);border-radius:12px;padding:48px 40px;max-width:480px;width:100%;text-align:center}
.icon{width:56px;height:56px;border-radius:50%;background:var(--signal-dim);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 24px}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:12px}
p{font-size:15px;color:#A8B0C0;margin-bottom:6px}
.ref{font-family:'Space Grotesk',monospace;font-size:13px;color:var(--signal);margin:20px 0 28px;letter-spacing:0.06em}
.btn{display:inline-block;background:var(--signal);color:var(--ink);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:12px 24px;border-radius:6px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>Booking request received</h1>
  <p>Thanks, <strong>{{ booking.name }}</strong>. We have your request for</p>
  <p><strong>{{ booking.vehicle }}</strong> — {{ booking.service }}</p>
  <div class="ref">REF #{{ booking.id }}</div>
  <p style="margin-bottom:28px">A technician will call <strong>{{ booking.phone }}</strong> to confirm your arrival window within 60 minutes.</p>
  <a href="/" class="btn">Back to home</a>
</div>
</body>
</html>
