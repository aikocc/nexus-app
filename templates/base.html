<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Nexus Diagnostics{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0B0E14; --paper: #F7F8FA; --paper-dim: #ECEEF2;
  --signal: #00D9A3; --signal-dim: #0A3B30; --alert: #FF6B4A;
  --gray: #7C8699; --line: #1C2230; --line-light: #DCDFE6;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.6}
{% block extra_styles %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
