{% extends "public/base_public.html" %}

{% block title %}Contact — Nexus Diagnostics{% endblock %}

{% block public_content %}
<section class="section-light">
    <div class="container">
        <h1 class="section-title">Contact Us</h1>
        <p class="section-sub">We're here to help.</p>
        <div class="contact-grid">
            <div class="contact-item">
                <span class="contact-label">Phone</span>
                <span class="contact-value">1300 000 000</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Email</span>
                <span class="contact-value">info@nexusdiagnostics.com.au</span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Hours</span>
                <span class="contact-value">Mon–Sat, 7am–7pm</span>
            </div>
        </div>
    </div>
</section>
{% endblock %}
