{% extends "public/base_public.html" %}

{% block title %}Register — Nexus Diagnostics{% endblock %}

{% block public_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-mark">ND</span>
            <span class="logo-text">Nexus<span class="logo-accent">Diagnostics</span></span>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Register for the customer portal.</p>
        
        <form method="POST" class="auth-form">
            <div class="field">
                <label>Full Name</label>
                <input type="text" class="form-input" placeholder="John Smith">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" class="form-input" placeholder="you@email.com">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" class="form-input" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Register</button>
        </form>
        <a href="{{ url_for('auth.login') }}" class="auth-back">Already have an account? Sign in</a>
    </div>
</div>
{% endblock %}
